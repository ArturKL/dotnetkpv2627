services:
  db:
    image: postgres:16-alpine
    container_name: dotnetkpv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dotnetkpv
    ports:
      - "5432:5432"
    volumes:
      - dotnetkpv_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dotnetkpv_data: